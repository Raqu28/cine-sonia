<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSonia - Tus Películas Gratis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🍿 SECCIÓN PRINCIPAL DE LA APP LIBRE (Entra directo sin pedir nada) -->
    <div id="seccion-app">
        <header>
            <div class="logo">🍿 CineSonia</div>
            <div class="buscador">
                <input type="text" id="input-buscar" placeholder="Busca una película...">
                <button id="btn-buscar">Buscar</button>
            </div>
        </header>

        <main>
            <h2>Películas Populares</h2>
            <div id="contenedor-peliculas" class="grid-peliculas"></div>
        </main>
    </div>

    <!-- 🎥 VENTANA FLOTANTE DEL REPRODUCTOR MULTIMEDIA -->
    <div id="modal-reproductor" class="modal">
        <div class="contenido-modal">
            <span id="btn-cerrar">&times;</span>
            <div class="contenedor-video">
                <div id="reproductor-destino"></div>
            </div>
        </div>
    </div>

    <!-- Enlazamos tu archivo de JavaScript como tipo módulo -->
    <script src="script.js" type="module"></script>
</body>
</html>
