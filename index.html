<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSonia - Tus Películas Gratis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 🔐 PANTALLA DE LOGIN Y REGISTRO (Se muestra si no has iniciado sesión) -->
    <div id="seccion-auth" class="contenedor-auth">
        <div class="tarjeta-auth">
            <h2>🎬 Bienvenido a CineSonia</h2>
            <p>Inicia sesión con tu correo para ver películas gratis</p>
            <input type="email" id="auth-correo" placeholder="Tu correo electrónico" autocomplete="email">
            <input type="password" id="auth-contrasena" placeholder="Tu contraseña" autocomplete="current-password">
            <div class="botones-auth">
                <button id="btn-login">Ingresar</button>
                <button id="btn-registro" class="btn-secundario">Registrarse</button>
            </div>
            <button id="btn-recuperar" class="btn-recuperar" type="button">Olvidé mi contraseña</button>
        </div>
    </div>

    <!-- 🍿 SECCIÓN PRINCIPAL DE LA APP (Oculta hasta que inicies sesión) -->
    <div id="seccion-app" style="display: none;">
        <header>
            <div class="logo">🍿 CineSonia</div>
            <div class="buscador">
                <input type="text" id="input-buscar" placeholder="Busca una película...">
                <button id="btn-buscar">Buscar</button>
            </div>
            <button id="btn-cerrar-sesion" class="btn-secundario">Salir</button>
        </header>

        <main>
            <h2>Películas Populares</h2>
            <div id="contenedor-peliculas" class="grid-peliculas"></div>
        </main>
    </div>

    <!-- 🎥 VENTANA FLOTANTE DEL REPRODUCTOR -->
    <div id="modal-reproductor" class="modal">
        <div class="contenido-modal">
            <span id="btn-cerrar">&times;</span>
            <div class="contenedor-video">
                <div id="reproductor-destino"></div>
            </div>
        </div>
    </div>

    <!-- Enlazamos tu archivo JavaScript principal como tipo módulo -->
    <script src="script.js" type="module"></script>
</body>
</html>
