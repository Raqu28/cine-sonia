<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSonia - Buscador de Películas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 <span class="neon-text">CineSonia</span></h1>
        <p class="neon-pink">Encuentra tus películas y series favoritas</p>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Escribe el nombre de una película...">
            <button id="search-button">Buscar</button>
        </div>
    </header>

    <main>
        <div id="results-container" class="movies-grid"></div>
    </main>
        <!-- Ventana Flotante (Modal) para los resúmenes -->
    <div id="movie-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-details">
                <!-- Acá el JavaScript va a meter el resumen de forma automática -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
