<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSonia - Películas Gratis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>CineSonia</h1>
        <p>Cine libre, legal y al instante</p>
    </header>

    <!-- Sección del Reproductor -->
    <section class="reproductor-seccion">
        <video id="reproductorPrincipal" controls poster="https://unsplash.com">
            <source id="videoSource" src="" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>
    </section>

    <!-- Sección del Catálogo -->
    <main>
        <h2 class="catalogo-titulo">Películas Disponibles</h2>
        <div id="contenedorCatalogo" class="grilla-peliculas">
            <!-- Las películas se cargarán acá dinámicamente con JS -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
